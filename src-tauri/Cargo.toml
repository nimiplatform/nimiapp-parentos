[package]
name = "nimiplatform-parentos"
version = "0.1.0"
description = "ParentOS (成长底稿) native data host for Electron"
authors = ["Nimi Team"]
edition = "2021"
default-run = "parentos_host"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tauri = { version = "2", features = ["protocol-asset"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = true, features = ["clock"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde_yaml = "0.9"
rfd = "0.17"
tempfile = "3"
nimi-shell-tauri = { path = "../../../nimi/kit/shell/tauri" }
# Image decode / downsample / re-encode for orthodontic photo sessions
# (PO-ORTHO-012). Default codec set is heavy; we admit only the formats the
# contract allows on input plus JPEG output.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
