  # ── 以下为已有系统表 ────────────────────────────────────

  - name: app_settings
    description: "App-level local settings."
    columns:
      - { name: key, type: TEXT, pk: true }
      - { name: value, type: TEXT, nullable: false }
      - { name: updatedAt, type: TEXT, nullable: false, description: "ISO 8601 datetime" }

constraints:
  - "ParentOS local storage is account-scoped: each authenticated subject resolves a dedicated SQLite database file, and rows from one subject must not be read from another subject's database."
  - "All ULID fields use ULID identifiers."
  - "All datetime fields use ISO 8601 strings."
  - "JSON payloads are stored as TEXT and must remain valid JSON on read/write."
  - "childId is the primary filter field for child-scoped tables."
  - "growth_reports.reportType is limited to monthly | quarterly | quarterly-letter | custom."
  - "Child deletion cascades through all child-scoped current-baseline tables: milestone_records, reminder_states, vaccine_records, posture_assessments, journal_entries, ai_conversations, growth_reports, dental_records, allergy_records, sleep_records, medical_events, tanner_assessments, fitness_assessments, outdoor_records, vision_followup_settings, health_record_events, health_record_values, attachments, custom_todos, orthodontic_cases, orthodontic_appliances, orthodontic_checkins, orthodontic_unwear_intervals, orthodontic_photo_sessions."
  - "Child deletion also purges every child-scoped user-generated file path under storage_layout.files and clears any legacy renderer journal draft key parentos:journal-draft:{childId}; durable journal draft bodies are not admitted in browser localStorage."
  - "vision_followup_settings.cadenceMonths is constrained to the integer range 1..36 at the bridge boundary; values outside this range must fail-close. customNextDate must be ISO 8601 YYYY-MM-DD when present."
  - "orthodontic_cases deletion cascades to orthodontic_appliances, orthodontic_checkins, orthodontic_unwear_intervals, and orthodontic_photo_sessions. orthodontic_appliances deletion cascades to orthodontic_checkins, orthodontic_unwear_intervals, and orthodontic_photo_sessions (when pinned via applianceId)."
  - "orthodontic_photo_sessions deletion cascades to its attachments rows AND the on-disk session directory under ${parentosAppDataRoot}/orthodontic/photos/{childId}/{sessionId}/, where parentosAppDataRoot = Runtime.GetAppStorage(nimi.parentos).durableDataRoot (PO-ORTHO-012). The attachments-row purge and file purge run inside the same Tauri command transaction; the FK chain does not cascade attachments because attachments is the unified owner-polymorphic table with no per-owner FK back."
  - "orthodontic_unwear_intervals enforces at most one open interval (endAt IS NULL) per applianceId via a partial unique index, per orthodontic-contract.md#PO-ORTHO-005a."
  - "orthodontic_checkins.checkinType is restricted to aligner-change | expander-activation; legacy wear-daily / retention-wear were permanently retired by migration v15 (PO-ORTHO-005b)."
  - "children.allergies JSON array remains as a quick-access summary; allergy_records is the structured source of truth."
  - "health_record_events + health_record_values are the canonical storage for measurement-shaped and assessment-shaped health facts after the PO-HREC hard cut."
  - "growth_measurements is not a current-baseline table; the console reads only health_record_events + health_record_values and must not dual-read, backfill, or drop growth_measurements."
  - "health_record_values.metricId must resolve to tables/health-metric-registry.yaml; values whose metric id cannot be resolved must fail closed before save."
  - "Derived health_record_values are engine-owned recomputations performed inside the PO-CAPT save transaction or a full snapshot rebuild; UI forms must not write derived metrics directly."
  - "attachments.ownerTable=health_record_events is used for unified health record attachments; retained stateful tables may remain attachment owners only when listed in health_record_unification.retained_stateful_tables."
