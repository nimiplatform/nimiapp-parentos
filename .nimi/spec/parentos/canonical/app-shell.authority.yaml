format: nimicoding.authority/v2
owner: team.parentos
scope: parentos.app-shell
units:
  - id: definition.parentos.app.shell.contract
    kind: definition
    title: App Shell contract
    meaning: The App Shell contract defines the ParentOS behaviors, data shapes, ownership boundaries, and failure semantics governed by its explicit rules.
  - id: rule.parentos.shell.r001
    kind: rule
    title: Bootstrap Order
    modality: must
    statement: "ParentOS is the installed Nimi app identified only as nimi.parentos. The renderer MUST NOT construct or receive caller identity, app instance, device, launch host, release descriptor, nonce, Runtime endpoint, Realm URL, account projection, protected metadata, or any token/session material. Environment variables, argv, renderer configuration, and a generic Runtime bridge are not admitted sources for those values. Electron MUST bind the shared Kit local-app host to the platform-native protected carrier for Nimi-owned operations. Runtime owns that opaque carrier session and verifies the app, release, peer process, account generation, and Runtime epoch outside the renderer. Each platform is admitted independently; a platform without a verified native carrier MUST keep protected Nimi features unavailable and MUST NOT fall back to localhost gRPC or a same-user daemon. ParentOS SQLite, media, settings, routes, and exact native product commands are app_owned_authority, not a ParentOS-wide Nimi permission gate. Their availability MUST NOT create a manifest permission, user prompt, grant row, synthetic scope, or Runtime admission decision. The native host derives fixed roots from its OS application-data API; env, argv, renderer input, and user configuration cannot select those roots. Canonical-path, escape, symlink, quota, schema, and exact renderer-origin checks remain mandatory app-host enforcement. Renderer-to-native media writes MUST reject encoded payloads before decode when their maximum decoded size cannot fit, then re-check the decoded object size. Images are limited to 25 MiB per object, journal audio to 64 MiB per object, and the complete durable ParentOS data partition to 2 GiB when admitting a media write. All media entry points share one native quota lock, reject symbolic-link or non-regular partition entries, account for replacement size, and persist through a same-directory temporary file plus atomic replacement so rejection or write failure leaves no partial target. The local product bootstrap sequence is: bind the exact Electron app host and fixed OS app-data roots; register only the enumerated ParentOS-owned native commands alongside Kit's bounded local-app carrier; initialize the device-local ParentOS SQLite database, media roots, and app settings; hydrate family/child state and render the spec-registered product routes; when a feature crosses into Runtime, Realm, Agent, Cognition, another app, or an external file, evaluate that feature's canonical permission, one-shot consent, or service entitlement independently. ParentOS MUST refuse to create a generic Runtime, NimiClient, Realm client, account caller, AI client, or renderer-owned session merely to open app-owned data. Runtime or permission unavailability disables only the affected protected feature; it does not lock SQLite or product routes. A failure of the fixed native data host, canonical root, SQLite schema, or migration may lock local data because those are actual prerequisites of the app-owned store."
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-SHELL-001.
    failure: Fail closed and report PO-SHELL-001 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.app.shell.contract
  - id: rule.parentos.shell.r008
    kind: rule
    title: Account Material Custody Boundary
    modality: must
    statement: "ParentOS MUST NOT persist, project, or transit access tokens or refresh tokens at any layer (renderer, Tauri host, SQLite, OS keychain, or any other store). Runtime owns account and credential custody (spec K-ACCSVC-008 / R-OAUTH-008). Concretely: The desktop shell must not call applyToken(accessToken, refreshToken) or any equivalent that takes refresh-token material. The Tauri shared desktop auth-session bridge (auth_session_load/save/clear) must not be invoked from ParentOS bootstrap or login paths. The platform client's refreshTokenProvider, accessTokenProvider, accessToken, subjectUserIdProvider, and sessionStore inputs are forbidden. The installed-app SDK projection exposes no such ParentOS inputs. ParentOS does not construct a Realm client until a Realm-owned product feature is explicitly admitted. When direct Realm calls are later admitted, access tokens must be projected from Runtime account custody (short-lived, never persisted, never returned to ParentOS surfaces) and consumed through SDK Realm typed services / adapters. ParentOS does not own Nimi embedded login, logout, OAuth browser brokering, loopback listeners, account projection, or account-control RPCs. Nimi account login, logout, and switching are first-party Desktop / Runtime responsibilities and affect only Nimi-owned features. The current ParentOS product opens its device-local app-owned data without a Nimi account. Any future account-partitioned local store must be an explicit ParentOS product partition or an opaque host-projected base entitlement; it must not be inferred from renderer-supplied Nimi identity material."
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-SHELL-008.
    failure: Fail closed and report PO-SHELL-008 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.app.shell.contract
  - id: rule.parentos.shell.r002
    kind: rule
    title: Route Registration
    modality: must
    statement: "Route registration must be a strict projection of data/structured/parentos/routes.yaml. every route listed in data/structured/parentos/routes.yaml must be registered in routes.tsx every route registered in routes.tsx must exist in data/structured/parentos/routes.yaml current registered surfaces include /reports, /profile, /settings/reminders, and /settings/ai; retired /profile/* child shells may remain registered only as redirects to /profile only routes marked nav: true in data/structured/parentos/routes.yaml may appear in shell navigation hidden, orphan, or experimental pages are not admitted shell surfaces until they are added to data/structured/parentos/routes.yaml"
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-SHELL-002.
    failure: Fail closed and report PO-SHELL-002 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.app.shell.contract
  - id: rule.parentos.shell.r003
    kind: rule
    title: Typed Shell State
    modality: must
    statement: "The shell-level state required for the current baseline is: | Field | Type | Invariant | | familyId | string \\| null | null only when no local family exists yet in the current local storage scope | | children | ChildRecord[] | rows are projected from data/structured/parentos/local-storage.yaml#children without dropping required fields | | activeChildId | string \\| null | must reference an item in children when not null | | nurtureMode | relaxed \\| balanced \\| advanced | value must come from data/structured/parentos/nurture-modes.yaml | | nurtureModeOverrides | Record<string, NurtureMode> \\| null | domains must align with spec-governed knowledge domains | JSON-backed child fields such as nurtureModeOverrides, allergies, medicalNotes, and recorderProfiles must be parsed and serialized through typed bridge mappers."
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-SHELL-003.
    failure: Fail closed and report PO-SHELL-003 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.app.shell.contract
  - id: rule.parentos.shell.r004
    kind: rule
    title: Nurture Mode Persistence
    modality: must
    statement: Nurture mode settings are child-scoped and must round-trip through the children table. nurtureMode is required and defaults to balanced only when a record is first created with the field absent nurtureModeOverrides is optional JSON text and may only override domains supported by the current app nurture mode may change reminder visibility and AI detail for P1-P3 items nurture mode must never weaken P0 delivery or safety thresholds
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-SHELL-004.
    failure: Fail closed and report PO-SHELL-004 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.app.shell.contract
  - id: rule.parentos.shell.r005
    kind: rule
    title: Family and Child Selection
    modality: must
    statement: The shell supports a single local family with multiple children inside the active ParentOS-owned local database. child create, edit, and delete flows operate on the local SQLite store current bootstrap uses the device-local partition and requires no Nimi permission or Nimi account a future ParentOS-owned account partition switch must clear in-memory family and child state, bind the exact new app partition, and only then load its rows a Nimi account switch invalidates protected Nimi feature state but MUST NOT silently select, merge, expose, or delete ParentOS local partitions switching the active child refreshes profile, timeline, journal, advisor, and reports views from that child's local records deleting a child must rely on storage-layer cascade behavior for dependent rows
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-SHELL-005.
    failure: Fail closed and report PO-SHELL-005 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.app.shell.contract
  - id: rule.parentos.shell.r006
    kind: rule
    title: Settings Surfaces
    modality: must
    statement: "Current settings authority includes: /settings/children for child CRUD /settings/nurture-mode for nurture-mode and per-domain overrides /settings/reminders for reminder frequency override management /settings/ai for ParentOS model/runtime preferences /settings for app language preference, persisted in app_settings /settings for user-initiated local structured-data backup export and restore under rule.parentos.shell.r009 Settings state must round-trip through children or app_settings. ParentOS declares ai_config_ui.allowed_routes as exactly [local], and both its in-App editor and Desktop centralized editor offer only Local as a new AIConfig route choice while continuing to show and permit clearing or changing any already committed route; this is a presentation constraint derived from the product privacy boundary, not AppAccess, permission, owner eligibility, Runtime validation, execution admission, or a second AIConfig truth. The shell must not invent shadow config stores outside those admitted persistence paths."
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-SHELL-006.
    failure: Fail closed and report PO-SHELL-006 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.app.shell.contract
  - id: rule.parentos.shell.r007
    kind: rule
    title: Fail-Close Behavior
    modality: must
    statement: "The shell must fail closed when spec-governed prerequisites are invalid. app-data bootstrap failures map to app-data-unavailable or app-data-repair-required, keep the app-owned store closed, and expose an actionable retry or repair instruction a protected Nimi feature failure remains local to that feature and MUST NOT clear, lock, or relabel app-owned family data as permission-denied renderer metadata, env, argv, display app id, or a direct gRPC connection must not turn a protected feature failure into a positive Nimi session a missing public permission or service entitlement is typed unavailable/denied for the affected feature, not a ParentOS-wide capability gate missing compiled knowledge-base artifacts is a startup failure route drift against data/structured/parentos/routes.yaml is a verification failure, not a runtime fallback case malformed typed bridge payloads must raise an error instead of returning placeholder success objects missing nurture-mode parameters must not be patched with ad hoc values outside the spec-defined balanced default Exclusions The following remain outside this contract: family collaboration and multi-account sharing (PO-FEAT-030) cloud sync or remote backup any use of the ability-model design asset as a frozen runtime contract"
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-SHELL-007.
    failure: Fail closed and report PO-SHELL-007 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.app.shell.contract
  - id: rule.parentos.shell.r009
    kind: rule
    title: Local Structured Data Backup and Restore
    modality: must
    statement: ParentOS MAY expose a user-initiated local structured-data backup and restore surface in /settings. This is not cloud sync, remote backup, or a complete media archive. Export MUST use an explicit versioned envelope bound to appId nimi.parentos, include only the current admitted SQLite structured tables, replace every reusable local media path with null, and exclude attachments rows, orthodontic photo-session rows, photo-session metadata, and all media bytes. The Electron main process MUST own a one-shot native save or open dialog and MUST return only display-safe file content or file names, never a reusable absolute path. Restore MUST reject invalid JSON, unknown or missing envelope fields, a wrong appId or format version, unknown or missing tables or columns, values incompatible with the live SQLite schema, and any current database containing media-backed rows or reusable media paths. The complete envelope and every row MUST be validated before the first write. Restore semantics are full replacement of the admitted structured tables inside one SQLite transaction with foreign-key verification before commit; any validation, delete, insert, constraint, or commit failure MUST roll back the entire restore and preserve the pre-restore database. Renderer-side sequential per-table writes, duplicate skipping, partial merge, compatibility coercion, legacy adapters, and fail-open import are forbidden.
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-SHELL-009.
    failure: Fail closed and report PO-SHELL-009 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.app.shell.contract
