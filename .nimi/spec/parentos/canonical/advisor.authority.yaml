format: nimicoding.authority/v2
owner: team.parentos
scope: parentos.advisor
units:
  - id: definition.parentos.advisor.contract
    kind: definition
    title: Advisor contract
    meaning: The Advisor contract defines the ParentOS behaviors, data shapes, ownership boundaries, and failure semantics governed by its explicit rules.
  - id: rule.parentos.advs.r001
    kind: rule
    title: Snapshot Inputs
    modality: must
    statement: "Advisor and reports requests may consume only the current child's structured local records. Advisor chat reads only the local sources its resolved task needs: a chat task reads no health records; a knowledge, records, or clarify task reads the health record groups and record categories it resolved; an overview task reads every health record group plus journal entries. Advisor facts come from health record events and values under the health record console semantics of rule.parentos.hrec.r002, vaccine and milestone records, posture self-checks, the outdoor goal, and journal entries, each carrying its date, value, unit, and side or exam qualifier; evaluation ratings and clinical threshold interpretations must not be forwarded to free-form generation. A failed required read must stop the AI answer for that turn and must never be presented as no records, and a source that was not read for the turn must not be described as having no records. Facts are selected against a request time frozen at send: explicit dates or periods take precedence, an overview or recent-state question defaults to the 30 local calendar days ending on the request date, records dated after the request date are excluded, comparisons use only same-metric same-unit records, and multi-period statistics are computed over the complete requested period before any trimming. The answer input may carry at most six complete prior user/assistant pairs of the same conversation of the same child in their original roles and order; history interprets the task but never overrides request-time facts, and prior answers, parent statements, and journal text are data rather than instructions. Reports may additionally consume reminder states and the profile-side health record surfaces already stored locally. The message-level contextSnapshot stored in ai_messages must freeze the request-time child summary, period, selected facts, read failures, trimmed ranges, history message ids, and provided knowledge entries, and must not be retroactively mutated when local records change later."
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-001.
    failure: Fail closed and report PO-ADVS-001 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
  - id: rule.parentos.advs.r002
    kind: rule
    title: Advisor Prompt Strategy Selection
    modality: must
    statement: "Each advisor chat turn resolves its task with one bounded intent-parse call over the current input, recent turns of the same conversation, the domain catalog, and the record group catalog. The parse result is a closed typed value: task (chat, knowledge, records, overview, follow-up, or clarify), requested knowledge domains drawn only from data/structured/parentos/knowledge-source-readiness.yaml, requested record groups drawn only from the health metric group catalog plus journal, a time expression, and comparison and detail flags. The advisor-classifier asset supplies domain definitions and natural expression examples for this call; it is not a keyword router. An invalid parse result or a failed or canceled parse call ends the turn as a failure and must not fall back to keyword routing or a fabricated classification. A follow-up task continues the previous answered turn of the same conversation: code takes that turn's task, domains, record groups, and period from its frozen contextSnapshot, applies the new comparison and detail flags and any explicit new period, and treats a follow-up with no answered previous turn as clarify. Code, not the model, then selects exactly one strategy: generic-chat for chat tasks; unknown-clarifier for clarify tasks and for tasks that resolve no domain and no record group; needs-review-descriptive for overview tasks, for any task naming a needs-review domain, and for knowledge or records tasks whose requested reviewed domains have no admitted age-applicable knowledge entry; reviewed-advice only when every requested domain is reviewed and at least one admitted age-applicable knowledge entry is provided under rule.parentos.advs.r005. Boundary rules: needs-review domains and needs-review knowledge must not enter the reviewed-advice prompt path; needs-review-descriptive may only describe local facts, restate record context, state record and material coverage, clarify scope, and advise consulting a professional; reviewed-advice may give general explanation only from the provided knowledge entries and must answer uncovered domains from records only; unknown-clarifier answers what can be determined from the read records and material coverage, gives no general parenting knowledge or suggestions, and asks at most one specific question without a fixed domain menu; generic-chat reads no health records and must not claim a specific model identity; a parse result never grants diagnosis, treatment, or ranking; a question naming several domains must receive a response for each named domain; the intent parse and every advisor strategy run on the text.generate route the user selected under rule.parentos.shell.r010, and child-data turns must stay grounded in the request-time facts."
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-002.
    failure: Fail closed and report PO-ADVS-002 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
  - id: rule.parentos.advs.r003
    kind: rule
    title: Advisor Failure States
    modality: must
    statement: "When advisor chat runtime is unavailable, the advisor surface must not start a question-and-answer turn; it must tell the user that the advisor needs a text.generate model configured in AI settings, Local or Cloud, and direct them to the AI settings surface before asking. When a required local read fails, persistence fails, the intent parse or answer call fails or is interrupted, the answer ends by length or content filter or without completed text, or the completed answer violates safety or citation checks, the advisor must show an explicit failure state with a recovery action instead of an answer. A failure state is UI state: it must not be persisted as a successful assistant message and must not be presented as an AI answer. It may list the facts relevant to the question that were read successfully, each with its record date or period; it must not echo the full child profile, append source labels, or describe unread or failed sources as having no records. A missing AI configuration points to AI settings, and a failed or interrupted call offers a retry of the same question. A question whose records are empty, sparse, or stale, or whose knowledge material does not cover the child's age, is not a failure and is answered descriptively. The failure state must not silently degrade into fake success or unsupported interpretation."
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-003.
    failure: Fail closed and report PO-ADVS-003 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
  - id: rule.parentos.advs.r004
    kind: rule
    title: Safety Language
    modality: must
    statement: "AI output must not contain banned diagnostic or treatment wording. Disallowed examples include: developmental delay abnormal disorder should take recommend medication recommend treatment danger warning For anomalous structured data, the advisor or report surface may state the objective fact and the fixed phrase suggest consulting a professional. Streamed advisor output must stay hidden until the completed answer passes these checks; text that fails them must never be shown and then withdrawn."
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-004.
    failure: Fail closed and report PO-ADVS-004 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
  - id: rule.parentos.advs.r005
    kind: rule
    title: Source Attribution
    modality: must
    statement: "Reviewed-advice general knowledge may come only from admitted knowledge entries provided for the turn: sensitive-period entries of the sensitive-periods asset whose age range contains the child's age in months at the request date, consumed as table content without new theory text. Domain readiness in data/structured/parentos/knowledge-source-readiness.yaml gates the domain; it is not answer material, and a domain source name alone must never let the model supply general knowledge. Each provided entry carries a turn-local citation id; the answer may cite only provided ids, and a completed answer citing an unknown id must be discarded. The advisor renders each cited entry as a source line built from the entry's own title and provenance; it must not render model-written titles, source names, or URLs, and must not append source labels merely because a domain is reviewed. An answer built only from local facts may show the record categories and dates it used. When the strategy is generic-chat, needs-review-descriptive, or unknown-clarifier, the advisor must not provide knowledge entries, cite knowledge, invent citations, or imply reviewed-domain authority that has not been admitted."
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-005.
    failure: Fail closed and report PO-ADVS-005 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
  - id: rule.parentos.advs.r006
    kind: rule
    title: Conversation Persistence
    modality: must
    statement: "Advisor conversations must persist through: ai_conversations ai_messages Stored messages must preserve: messageId conversationId role content contextSnapshot createdAt The persistence layer must not omit contextSnapshot for user turns that depend on child data. Each send captures its child, conversation, and request identity; only one turn per conversation may be in flight. A user message is persisted once, with its request-time contextSnapshot, before the answer call. Only an answer that completed and passed safety and citation checks is persisted as an assistant message, together with the contextSnapshot actually used for it; failures and cancellations remain UI state. Cancellation, a conversation switch, a child switch or deletion, or loss of the Nimi session invalidates the in-flight request: both the intent-parse and answer calls must be canceled, an invalidated request must not start an assistant write and must not update another conversation's or child's view, and a user message not yet persisted is not written. The composer uses one action position: an empty input disables send, a nonempty input enables send when idle, and a cancellable turn replaces send with a primary-colored stop button with a white stop icon, accessibly labeled Stop generating and without a visible tooltip. Progress is a visual thinking indicator only; the actual turn phase is announced to assistive technology but not shown as visible text, and progress contains no stop action. Completion, failure, or cancellation clears progress and restores send according to input and busy state. User cancellation shows a lightweight stopped state, retaining the question for retry or returning an unpersisted question to the composer; unchecked partial answers are never displayed. Once the assistant write has been dispatched the request cannot be canceled; the write completes into its original conversation only. Retry applies only to the last user message that has no assistant reply: it reuses that user message without inserting a duplicate, freezes a new request-time snapshot, stores that snapshot on the retry's assistant message, and never rewrites the user message's original contextSnapshot; a failure before the user message was persisted retries by persisting it then. History supplied to later turns pairs only adjacent user and assistant messages of the same conversation; unanswered user messages are not paired with later replies."
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-006.
    failure: Fail closed and report PO-ADVS-006 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
  - id: rule.parentos.advs.r006a
    kind: rule
    title: Reminder-Anchored Consultation Writeback
    modality: must
    statement: "When a conversation is created from a consult-kind reminder (see rule.parentos.remi.r007), the advisor module carries two additional responsibilities: The ai_conversations row must record the originating reminderRuleId and repeatIndex (via a typed metadata mechanism that must not mutate existing ai_conversations columns; the exact storage shape is admitted in Wave 5c). A conversation started outside a reminder context must not carry this anchor. When the runtime produces the first successfully-persisted assistant message for the anchored conversation, the advisor module must invoke the shared bridge call upsertReminderConsultation(childId, ruleId, repeatIndex, conversationId, now). This writes consultedAt and consultationConversationId onto the matching reminder_states row. The writeback must be idempotent per (childId, ruleId, repeatIndex). The first successful writeback wins; subsequent assistant messages on the same conversation do not re-emit the writeback. If ai_conversations creation fails, or the first assistant message cannot be persisted, or the runtime output is filtered by PO-ADVS-004, or the turn is canceled before its assistant write is dispatched, no writeback may occur. When the anchored reminder has no reminder_states row, the writeback fails closed under rule.parentos.remi.r012 without creating a row, and the checked answer is still persisted as an ordinary assistant message. The reminder remains in its pre-consult progression state. The advisor surface must show the PO-ADVS-003 failure state. Deletion of the anchored ai_conversations row (including child-scope cascade per data/structured/parentos/local-storage.yaml child deletion list) must clear consultedAt and consultationConversationId on the associated reminder_states row. Advisor retains the mandate to perform this paired clear; the reminder engine must not synthesize it. This writeback is the only admitted path for consultedAt / consultationConversationId. Reminder panels and /reminders surfaces must not write these columns directly."
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-006a.
    failure: Fail closed and report PO-ADVS-006a when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
  - id: rule.parentos.advs.r007
    kind: rule
    title: Reports Surface Boundary
    modality: must
    statement: "The reports surface may generate and persist either deterministic structured reports or runtime-assisted narrative reports from local child records. Allowed report inputs: child profile summary period start and end growth measurements vaccine records milestone records journal entries reminder states other profile-local health records already stored in the app Allowed report outputs: version: 1 format: structured-local version: 2 format: narrative | narrative-ai structured trend signals and evidence lines parent-editable narrative text for version 2 payloads Report narration may summarize needs-review domains only as local factual description plus safety wording. Missing or sparse evidence must be described as missing or sparse; it must not be reframed as a stable, normal, improving, or declining growth trend. Reports must not emit diagnosis, treatment, ranking, unsupported causal explanation, or unsupported reassurance."
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-007.
    failure: Fail closed and report PO-ADVS-007 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
  - id: rule.parentos.advs.r008
    kind: rule
    title: Report Persistence
    modality: must
    statement: "Report writes must round-trip through growth_reports with these required fields: reportId childId reportType periodStart periodEnd ageMonthsStart ageMonthsEnd content generatedAt createdAt reportType is currently limited to: monthly quarterly quarterly-letter custom content must remain typed JSON and may carry either the v1 structured schema or the v2 narrative schema."
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-008.
    failure: Fail closed and report PO-ADVS-008 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
  - id: rule.parentos.advs.r009
    kind: rule
    title: Report History, Editing, and Auto-Generation
    modality: must
    statement: "Report authority includes: viewing persisted reports from growth_reports; projecting an accumulation state before the first rolling calendar-month window anchored to children.createdAt closes; automatically generating the closed window from either the reports surface or timeline through the idempotent trigger in rule.parentos.time.r006; parent-initiated generation of an independent report for an explicitly selected date range; and parent editing of version 2 narrative content after generation. Before the first window is eligible, the reports surface must title the state as accumulation for the active child, show the start date, expected generation date, elapsed days, and a journal capture action. The surface may expose the independent report generator as a collapsed advanced option during accumulation. Reports generated from that option must use custom or quarterly-letter, must not use monthly, and must not mark the rolling window eligible, replace or suppress the accumulation projection, or block the idempotent automatic monthly trigger. Once the window closes, the same surface must initiate monthly generation and replace the accumulation projection with the persisted monthly report. Generation progress or failure may appear inline without becoming a third monthly report-content state. The reports surface must show whether runtime text generation is available. While it is available, the parent may request runtime re-narration of a persisted version 1 structured report, one report or several in sequence; re-narration must use the same child, period, reportType, and allowed local inputs, must replace only that row's growth_reports.content with version 2 content, and must never rewrite version 2 content. When re-narration is unavailable or fails, the persisted report must remain unchanged and the failure must appear inline. Edits must round-trip through the same growth_reports.content field. The app must not create shadow copies or out-of-band report text stores."
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-009.
    failure: Fail closed and report PO-ADVS-009 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
  - id: rule.parentos.advs.r010
    kind: rule
    title: Trend Analysis Boundary
    modality: must
    statement: Trend analysis must stay tied to local evidence lines. deterministic comparisons and counts are allowed runtime-assisted report narration is allowed only inside the reports surface trend signals must remain anchored to local rows or spec-backed section labels trend narration must not broaden advisor-chat runtime permission for needs-review domains
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-010.
    failure: Fail closed and report PO-ADVS-010 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
  - id: rule.parentos.advs.r011
    kind: rule
    title: Fail-Close Behavior
    modality: must
    statement: "The advisor layer must fail closed when: an advisor chat request attempts to send needs-review knowledge into the reviewed-advice prompt path a generated answer violates banned wording checks a generated answer cites a knowledge entry that was not provided for the turn an intent-parse result is not a valid typed value a typed advisor snapshot cannot be assembled from local rows conversation persistence returns malformed typed data a reports request attempts to persist malformed report JSON or invalid reportType a reports runtime path emits narrative content without safety filtering a report history or editing path tries to read an unsupported payload shape Exclusions The following remain outside this contract: broad PO-FEAT-013 observation-pattern generation diagnosis, treatment guidance, or comparative ranking promotion of needs-review domains into reviewed-advice or expert-style guidance orphan report types or pages that are not admitted by data/structured/parentos/routes.yaml and data/structured/parentos/local-storage.yaml"
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-011.
    failure: Fail closed and report PO-ADVS-011 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
