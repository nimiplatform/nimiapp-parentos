format: nimicoding.authority/v2
owner: team.parentos
scope: parentos.advisor
units:
  - id: definition.parentos.advisor.contract
    kind: definition
    title: Advisor contract
    meaning: The Advisor contract defines the ParentOS behaviors, data shapes, ownership boundaries, and failure semantics governed by its explicit rules.
  - id: rule.parentos.advs.r001
    kind: rule
    title: Snapshot Inputs
    modality: must
    statement: "Advisor and reports requests may consume only the current child's structured local snapshot. Required advisor-chat snapshot sections: child profile summary age in months health record console snapshot and underlying structured health record values vaccine records milestone records journal entries Reports may additionally consume reminder states and the profile-side health record surfaces already stored locally. The message-level contextSnapshot stored in ai_messages must freeze the request-time snapshot and must not be retroactively mutated when local records change later."
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-001.
    failure: Fail closed and report PO-ADVS-001 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
  - id: rule.parentos.advs.r002
    kind: rule
    title: Advisor Prompt Strategy Selection
    modality: must
    statement: "Advisor chat may enter the local runtime whenever request-time snapshot assembly and persistence succeed. The runtime prompt strategy must be selected from exactly one of: generic-chat reviewed-advice needs-review-descriptive unknown-clarifier Selection rules: reviewed-advice is allowed only when every inferred requested domain is reviewed in data/structured/parentos/knowledge-source-readiness.yaml any needs-review or mixed-domain question must use needs-review-descriptive child-specific questions with no resolved domain must use unknown-clarifier greetings, capability questions, model-identity questions, and other meta/product chat may use generic-chat Boundary rules: needs-review domains must not enter the reviewed-advice prompt path needs-review-descriptive may only describe local facts, restate record context, clarify scope, and advise consulting a professional unknown-clarifier must not skip directly to child-specific conclusions all advisor strategies must remain local-only and must not bypass snapshot grounding for child-data turns"
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-002.
    failure: Fail closed and report PO-ADVS-002 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
  - id: rule.parentos.advs.r003
    kind: rule
    title: Structured Advisor Fallback
    modality: must
    statement: "When advisor chat runtime is unavailable, the advisor surface must not start a question-and-answer turn; it must tell the user that the advisor requires a connected local AI and direct them to the AI settings surface to connect before asking. When request-time snapshot assembly fails, persistence fails, runtime output violates safety checks, or the runtime call itself fails during a turn, the advisor must return a structured fallback composed from local facts. The fallback must: echo the user question summarize the child snapshot with structured facts only append source labels when a spec-backed source is known use fixed safety wording when a domain is needs-review The fallback must not silently degrade into fake success or unsupported interpretation."
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-003.
    failure: Fail closed and report PO-ADVS-003 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
  - id: rule.parentos.advs.r004
    kind: rule
    title: Safety Language
    modality: must
    statement: "AI output must not contain banned diagnostic or treatment wording. Disallowed examples include: developmental delay abnormal disorder should take recommend medication recommend treatment danger warning For anomalous structured data, the advisor or report surface may state the objective fact and the fixed phrase suggest consulting a professional."
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-004.
    failure: Fail closed and report PO-ADVS-004 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
  - id: rule.parentos.advs.r005
    kind: rule
    title: Source Attribution
    modality: must
    statement: When an answer uses the reviewed-advice strategy, the advisor must append source labels projected from data/structured/parentos/knowledge-source-readiness.yaml. When the strategy is generic-chat, needs-review-descriptive, or unknown-clarifier, the advisor must not invent citations or imply reviewed-domain authority that has not been admitted.
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-005.
    failure: Fail closed and report PO-ADVS-005 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
  - id: rule.parentos.advs.r006
    kind: rule
    title: Conversation Persistence
    modality: must
    statement: "Advisor conversations must persist through: ai_conversations ai_messages Stored messages must preserve: messageId conversationId role content contextSnapshot createdAt The persistence layer must not omit contextSnapshot for user turns that depend on child data."
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-006.
    failure: Fail closed and report PO-ADVS-006 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
  - id: rule.parentos.advs.r006a
    kind: rule
    title: Reminder-Anchored Consultation Writeback
    modality: must
    statement: "When a conversation is created from a consult-kind reminder (see rule.parentos.remi.r007), the advisor module carries two additional responsibilities: The ai_conversations row must record the originating reminderRuleId and repeatIndex (via a typed metadata mechanism that must not mutate existing ai_conversations columns; the exact storage shape is admitted in Wave 5c). A conversation started outside a reminder context must not carry this anchor. When the runtime produces the first successfully-persisted assistant message for the anchored conversation, the advisor module must invoke the shared bridge call upsertReminderConsultation(childId, ruleId, repeatIndex, conversationId, now). This writes consultedAt and consultationConversationId onto the matching reminder_states row. The writeback must be idempotent per (childId, ruleId, repeatIndex). The first successful writeback wins; subsequent assistant messages on the same conversation do not re-emit the writeback. If ai_conversations creation fails, or the first assistant message cannot be persisted, or the runtime output is filtered by PO-ADVS-004, no writeback may occur. The reminder remains in its pre-consult progression state. The advisor surface must fall back to PO-ADVS-003 structured wording. Deletion of the anchored ai_conversations row (including child-scope cascade per data/structured/parentos/local-storage.yaml child deletion list) must clear consultedAt and consultationConversationId on the associated reminder_states row. Advisor retains the mandate to perform this paired clear; the reminder engine must not synthesize it. This writeback is the only admitted path for consultedAt / consultationConversationId. Reminder panels and /reminders surfaces must not write these columns directly."
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-006a.
    failure: Fail closed and report PO-ADVS-006a when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
  - id: rule.parentos.advs.r007
    kind: rule
    title: Reports Surface Boundary
    modality: must
    statement: "The reports surface may generate and persist either deterministic structured reports or runtime-assisted narrative reports from local child records. Allowed report inputs: child profile summary period start and end growth measurements vaccine records milestone records journal entries reminder states other profile-local health records already stored in the app Allowed report outputs: version: 1 format: structured-local version: 2 format: narrative | narrative-ai structured trend signals and evidence lines parent-editable narrative text for version 2 payloads Report narration may summarize needs-review domains only as local factual description plus safety wording. Missing or sparse evidence must be described as missing or sparse; it must not be reframed as a stable, normal, improving, or declining growth trend. Reports must not emit diagnosis, treatment, ranking, unsupported causal explanation, or unsupported reassurance."
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-007.
    failure: Fail closed and report PO-ADVS-007 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
  - id: rule.parentos.advs.r008
    kind: rule
    title: Report Persistence
    modality: must
    statement: "Report writes must round-trip through growth_reports with these required fields: reportId childId reportType periodStart periodEnd ageMonthsStart ageMonthsEnd content generatedAt createdAt reportType is currently limited to: monthly quarterly quarterly-letter custom content must remain typed JSON and may carry either the v1 structured schema or the v2 narrative schema."
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-008.
    failure: Fail closed and report PO-ADVS-008 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
  - id: rule.parentos.advs.r009
    kind: rule
    title: Report History, Editing, and Auto-Generation
    modality: must
    statement: "Report authority includes: viewing persisted reports from growth_reports; projecting an accumulation state before the first rolling calendar-month window anchored to children.createdAt closes; automatically generating the closed window from either the reports surface or timeline through the idempotent trigger in rule.parentos.time.r006; parent-initiated generation of an independent report for an explicitly selected date range; and parent editing of version 2 narrative content after generation. Before the first window is eligible, the reports surface must title the state as accumulation for the active child, show the start date, expected generation date, elapsed days, and a journal capture action. The surface may expose the independent report generator as a collapsed advanced option during accumulation. Reports generated from that option must use custom or quarterly-letter, must not use monthly, and must not mark the rolling window eligible, replace or suppress the accumulation projection, or block the idempotent automatic monthly trigger. Once the window closes, the same surface must initiate monthly generation and replace the accumulation projection with the persisted monthly report. Generation progress or failure may appear inline without becoming a third monthly report-content state. Edits must round-trip through the same growth_reports.content field. The app must not create shadow copies or out-of-band report text stores."
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-009.
    failure: Fail closed and report PO-ADVS-009 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
  - id: rule.parentos.advs.r010
    kind: rule
    title: Trend Analysis Boundary
    modality: must
    statement: Trend analysis must stay tied to local evidence lines. deterministic comparisons and counts are allowed runtime-assisted report narration is allowed only inside the reports surface trend signals must remain anchored to local rows or spec-backed section labels trend narration must not broaden advisor-chat runtime permission for needs-review domains
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-010.
    failure: Fail closed and report PO-ADVS-010 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
  - id: rule.parentos.advs.r011
    kind: rule
    title: Fail-Close Behavior
    modality: must
    statement: "The advisor layer must fail closed when: an advisor chat request attempts to send needs-review knowledge into the reviewed-advice prompt path a generated answer violates banned wording checks a typed advisor snapshot cannot be assembled from local rows conversation persistence returns malformed typed data a reports request attempts to persist malformed report JSON or invalid reportType a reports runtime path emits narrative content without safety filtering a report history or editing path tries to read an unsupported payload shape Exclusions The following remain outside this contract: broad PO-FEAT-013 observation-pattern generation diagnosis, treatment guidance, or comparative ranking promotion of needs-review domains into reviewed-advice or expert-style guidance orphan report types or pages that are not admitted by data/structured/parentos/routes.yaml and data/structured/parentos/local-storage.yaml"
    condition: Whenever ParentOS implements, stores, projects, or evaluates behavior governed by PO-ADVS-011.
    failure: Fail closed and report PO-ADVS-011 when the governed behavior does not satisfy this rule.
    relations:
      - type: applies_to
        target: definition.parentos.advisor.contract
