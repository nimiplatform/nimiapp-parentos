app_id: nimi.parentos
display_name: ParentOS
version: 0.1.5
profile: standalone
npm_package_name: nimiapp-parentos
cargo_package_name: nimiapp-parentos-shell
tauri_identifier: ai.nimi.apps.nimi.parentos
package_author: Nimi Platform
submission_role: developer-submitted-input
capability_contract_refs:
  - text.generate
  - audio.transcribe
required_standardized_feature_refs: []
storage_policy:
  kind: app-owned-os-storage
  os_storage_disclosure:
    - path_pattern: <Electron appData>/Nimi/ParentOS/{data,cache,tmp}/**
      purpose: Device-local family SQLite data, media and temporary files under %APPDATA% on Windows or ~/Library/Application Support on macOS. Retained after Nimi uninstall; managed by ParentOS.
      expected_size_band: Durable media writes enforce a 2 GiB partition limit; images up to 25 MiB and journal audio up to 64 MiB per object.
support_manifest:
  diagnostics_bundle_fields:
    - app_version
    - runtime_status
  redaction_rules:
    - credentials
  user_visible_issue_categories:
    - startup
    - runtime
  escalation_path: https://github.com/nimiplatform/nimiapp-parentos/issues
  kill_switch_visibility: visible
  recovery_instructions: Restart the App from Nimi. If the problem persists, reinstall the current admitted release.
review_inputs:
  manifest: nimi.app.yaml
  build_profile: .nimi/config/build-profile.yaml
  scaffold_boundary: .nimi/contracts/scaffold-boundary.yaml
admission_truth: platform-owned-after-review
