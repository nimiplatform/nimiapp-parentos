app_id: nimi.parentos
display_name: ParentOS
version: 0.1.0
profile: standalone
npm_package_name: nimiapp-parentos
cargo_package_name: nimiapp-parentos-shell
tauri_identifier: ai.nimi.apps.nimi.parentos
package_author: Nimi Platform
submission_role: developer-submitted-input
capability_contract_refs: []
required_standardized_feature_refs: []
storage_policy:
  kind: nimi-mediated-default
support_manifest:
  diagnostics_bundle_fields:
    - app_version
    - runtime_status
  redaction_rules:
    - credentials
  user_visible_issue_categories:
    - startup
    - runtime
  escalation_path: README.md#support
  kill_switch_visibility: visible
