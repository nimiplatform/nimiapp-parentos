schema_version: 1
app_id: nimi.parentos
display_name: ParentOS
profile: workspace-app
manifest_role: submitted-input
summary: >-
  ParentOS is an installed Nimi app for parent-owned child growth records,
  reminders, journaling, reports, and runtime-mediated AI assistance.
local_development:
  electron:
    renderer_origin: http://127.0.0.1:1426
    execution_profile_ref: opaque:windows-native-electron-development-v1
permissions:
  declared_nimi_api_scopes:
    - scope: ai.spend.meter
      qualifier: parentos-advisor
      purpose: Generate parent-facing explanation drafts through Runtime AI using host-owned model configuration.
    - scope: ai.spend.meter
      qualifier: parentos-vision
      purpose: Extract structured observations from parent-provided child development material through Runtime AI.
    - scope: ai.spend.meter
      qualifier: parentos-journal-audio
      purpose: Transcribe parent-recorded local journal audio through Runtime AI.
    - scope: file.read.scoped
      qualifier: app-local-drafts
      purpose: Read child and family records, drafts, reminders, reports, and local working data in host-owned app storage.
    - scope: file.write.scoped
      qualifier: app-local-drafts
      purpose: Store child and family records, drafts, reminders, reports, and local working data in host-owned app storage.
    - scope: data.scope.read
      qualifier: runtime.artifacts
      purpose: Read the Runtime-owned bootstrap artifact through the admitted typed app-host operation.
