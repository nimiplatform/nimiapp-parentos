table_family: product_catalog
owner: parentos
authority_class: product_authority_table
catalog_id: parentos.reference_data_assets
row_schema: assets[]
allowed_references: [.nimi/spec/parentos/canonical/*.authority.yaml, data/structured/parentos/*.yaml, data/knowledge/assets/*/asset.json]
forbidden_fields: [done, covered, coverage_status, audit_date, evidence_report, current, proposed, backlog_status, migration_status, mapping_status, run_id, ledger_ref]
schema_version: 3

field_contract:
  asset:
    assetId: { type: string, required: true }
    path: { type: string, required: true }
    storageModel: { type: enum, required: true, values: [directory_backed_asset] }
    format: { type: enum, required: true, values: [json] }
    authorityClass:
      type: enum
      required: true
      values: [reference_dataset, curated_knowledge_asset, design_asset]
    ownerContract: { type: string, required: true }
    assetContract: { type: string, required: true }
    generatedModule: { type: string, required: false }
    runtimeProjectionAdmission: { type: string, required: false }
    updatePolicy: { type: string, required: true }

assets: &parentos_reference_data_asset_entries
  - assetId: growth-standards
    path: data/knowledge/assets/growth-standards/asset.json
    storageModel: directory_backed_asset
    format: json
    authorityClass: reference_dataset
    ownerContract: rule.parentos.prof.r004
    assetContract: rule.parentos.know.r001
    generatedModule: growth-standards.gen.ts
    updatePolicy: "External clinical/growth reference data. Spec owns schema, source attribution, fail-close behavior, and evaluator binding; the asset body owns numeric/reference content."
  - assetId: milestone-catalog
    path: data/knowledge/assets/milestone-catalog/asset.json
    storageModel: directory_backed_asset
    format: json
    authorityClass: curated_knowledge_asset
    ownerContract: rule.parentos.prof.r007
    assetContract: rule.parentos.know.r001
    generatedModule: milestone-catalog.gen.ts
    updatePolicy: "Curated developmental milestone content. Spec owns ID stability and consumption rules; the asset body owns catalog content and age windows."
  - assetId: sensitive-periods
    path: data/knowledge/assets/sensitive-periods/asset.json
    storageModel: directory_backed_asset
    format: json
    authorityClass: curated_knowledge_asset
    ownerContract: rule.parentos.time.r006
    assetContract: rule.parentos.know.r001
    generatedModule: sensitive-periods.gen.ts
    updatePolicy: "Curated sensitive-period content. Spec owns direct-lookup behavior and safety boundary; the asset body owns period content."
  - assetId: observation-framework
    path: data/knowledge/assets/observation-framework/asset.json
    storageModel: directory_backed_asset
    format: json
    authorityClass: curated_knowledge_asset
    ownerContract: rule.parentos.jour.r006
    assetContract: rule.parentos.know.r001
    generatedModule: observation-framework.gen.ts
    updatePolicy: "Curated observation dimensions and quick tags. Spec owns closed-set tagging behavior; the asset body owns dimension content."
  - assetId: ability-model
    path: data/knowledge/assets/ability-model/asset.json
    storageModel: directory_backed_asset
    format: json
    authorityClass: design_asset
    ownerContract: definition.parentos.app.shell.contract
    assetContract: rule.parentos.know.r001
    updatePolicy: "Non-frozen design asset. It may support future product design but must not be treated as stable runtime authority without admission."
  - assetId: ai-boundary-rules
    path: data/knowledge/assets/ai-boundary-rules/asset.json
    storageModel: directory_backed_asset
    format: json
    authorityClass: curated_knowledge_asset
    ownerContract: rule.parentos.advs.r004
    assetContract: rule.parentos.know.r001
    generatedModule: ai-boundary.gen.ts
    updatePolicy: "Runtime AI boundary content asset. Spec owns the safety contract and fail-close requirement; the asset body owns concrete banned terms and fallback copy."
  - assetId: advisor-classifier
    path: data/knowledge/assets/advisor-classifier/asset.json
    storageModel: directory_backed_asset
    format: json
    authorityClass: curated_knowledge_asset
    ownerContract: rule.parentos.advs.r002
    assetContract: rule.parentos.know.r001
    generatedModule: advisor-classifier.gen.ts
    updatePolicy: "Runtime classifier content asset. Spec owns advisor routing and reviewed-domain gates; the asset body owns concrete keywords and generic-runtime phrase sets."
  - assetId: pediatric-drug-catalog
    path: data/knowledge/assets/pediatric-drug-catalog/asset.json
    storageModel: directory_backed_asset
    format: json
    authorityClass: curated_knowledge_asset
    ownerContract: definition.parentos.profile.contract
    assetContract: rule.parentos.know.r001
    generatedModule: pediatric-drug-catalog.gen.ts
    updatePolicy: "Cold-start local medicine dictionary asset for record entry and OCR normalization only. Spec owns the medical/AI safety boundary; the asset body owns concrete dictionary rows."
  - assetId: journal-guidance-catalog
    path: data/knowledge/assets/journal-guidance-catalog/asset.json
    storageModel: directory_backed_asset
    format: json
    authorityClass: curated_knowledge_asset
    ownerContract: definition.parentos.journal.contract
    assetContract: rule.parentos.know.r001
    generatedModule: journal-guidance.gen.ts
    updatePolicy: "Journal prompt and observation nudge copy asset. Spec owns journal/timeline behavior; the asset body owns canonical guidance copy."
  - assetId: smart-alert-rules
    path: data/knowledge/assets/smart-alert-rules/asset.json
    storageModel: directory_backed_asset
    format: json
    authorityClass: curated_knowledge_asset
    ownerContract: definition.parentos.timeline.contract
    assetContract: rule.parentos.know.r001
    generatedModule: smart-alert-rules.gen.ts
    updatePolicy: "Deterministic local smart-alert content/rule asset. Spec owns local-only behavior and fail-close posture; the asset body owns concrete normalization rows, templates, thresholds, and alert copy."

constraints:
  - "Spec contracts own dataset schemas, admission gates, source attribution, safety boundaries, and fail-close behavior."
  - "Reference data assets own concrete numeric/reference/content values and must not create product behavior outside their owner contract."
  - "Runtime policy/content assets that contain concrete phrases, dictionaries, alert copy, or normalization rows must be admitted here and stored under data/knowledge/assets/**, not as kernel table rows."
  - "Active asset paths point to directory-backed asset manifests. Old top-level data/knowledge/<assetId>.json files are not admitted."
  - "Directory-backed manifests must follow definition.parentos.knowledge.asset.contract, including schemaVersion, contentVersion, provenance, review state, sections, ordering, schema.json, cross-reference integrity, and projection fingerprinting."
  - "authorityClass=design_asset must not declare generatedModule or enter runtime without runtimeProjectionAdmission pointing to an admitted spec anchor."
  - "Unreferenced shards, direct JSON reads outside the admitted asset kernel, and generated-as-authority posture are fail-close violations after the atomic cut."
  - "Generated runtime constants must be produced from admitted spec plus admitted data assets; generated files must not be hand-edited."
  - "A health evaluator must fail closed or return an admitted non-scored status when a referenced data asset is missing, malformed, stale, or outside declared coverage."

entries: *parentos_reference_data_asset_entries
