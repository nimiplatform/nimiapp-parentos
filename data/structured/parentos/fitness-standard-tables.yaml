version: 1
id: parentos.fitness-standard-tables
purpose: >
  China National Student Physical Fitness Standards (国家学生体质健康标准) single-item
  grade thresholds for admitted school-stage tiers, used by the fitness.standard-grade
  evaluation policy and the fitness page grade badges / trend reference lines.
source:
  title: 国家学生体质健康标准（2014年修订）
  issuer: 中华人民共和国教育部
  document: 教体艺〔2014〕5号
  referenceUrls:
    - https://www.haowendang.cn/c0qimh1iddi0fvam2gyzr6h1tx45d76007j3_1.html
    - https://www.lngc.edu.cn/tyb/info/1028/1254.htm
derivation: >
  Each admitted school-stage tier resolves to the official single-item scoring table of
  the LOWEST grade in its band, so a child is never graded against an older grade's bar:
  grade12 → 小学一年级, grade34 → 小学三年级, grade56 → 小学五年级,
  grade7plus → 初中一年级(七年级). Threshold values are the official performance lines
  for score 60 (pass/及格), score 80 (good/良好), and score 90 (excellent/优秀) from the
  per-grade single-item scoring tables (表1-3 ~ 表1-16). Timed runs are lower_better;
  all other metrics are higher_better. Endurance runs (50米×8, 800米, 1000米) are stored
  in seconds, converted from the official 分·秒 notation. Preschool-tier metrics
  (10米折返跑, 网球掷远, 双脚连续跳, 走平衡木) have no national-standard scoring table
  and therefore no entries here; they stay unrated.
bands:
  - band: excellent
    minScore: 90
  - band: good
    minScore: 80
  - band: pass
    minScore: 60
tables:
  # ── grade12 → 小学一年级 ──────────────────────────────────────────────
  - tier: grade12
    sex: male
    metrics:
      - { metricId: fitness.run_50m, direction: lower_better, pass: 12.6, good: 10.6, excellent: 10.4 }
      - { metricId: fitness.sit_and_reach, direction: higher_better, pass: 0.0, good: 11.0, excellent: 13.0 }
      - { metricId: fitness.rope_skipping, direction: higher_better, pass: 17, good: 87, excellent: 99 }
      - { metricId: fitness.vital_capacity, direction: higher_better, pass: 700, good: 1300, excellent: 1500 }
  - tier: grade12
    sex: female
    metrics:
      - { metricId: fitness.run_50m, direction: lower_better, pass: 13.8, good: 11.8, excellent: 11.2 }
      - { metricId: fitness.sit_and_reach, direction: higher_better, pass: 2.4, good: 13.4, excellent: 16.0 }
      - { metricId: fitness.rope_skipping, direction: higher_better, pass: 17, good: 87, excellent: 103 }
      - { metricId: fitness.vital_capacity, direction: higher_better, pass: 600, good: 1000, excellent: 1200 }
  # ── grade34 → 小学三年级 ──────────────────────────────────────────────
  - tier: grade34
    sex: male
    metrics:
      - { metricId: fitness.run_50m, direction: lower_better, pass: 11.5, good: 9.5, excellent: 9.3 }
      - { metricId: fitness.sit_and_reach, direction: higher_better, pass: -0.8, good: 10.2, excellent: 13.4 }
      - { metricId: fitness.rope_skipping, direction: higher_better, pass: 34, good: 104, excellent: 116 }
      - { metricId: fitness.vital_capacity, direction: higher_better, pass: 900, good: 1700, excellent: 2100 }
      - { metricId: fitness.sit_ups, direction: higher_better, pass: 16, good: 36, excellent: 42 }
  - tier: grade34
    sex: female
    metrics:
      - { metricId: fitness.run_50m, direction: lower_better, pass: 12.0, good: 10.0, excellent: 9.4 }
      - { metricId: fitness.sit_and_reach, direction: higher_better, pass: 2.2, good: 13.2, excellent: 16.6 }
      - { metricId: fitness.rope_skipping, direction: higher_better, pass: 39, good: 109, excellent: 125 }
      - { metricId: fitness.vital_capacity, direction: higher_better, pass: 800, good: 1400, excellent: 1600 }
      - { metricId: fitness.sit_ups, direction: higher_better, pass: 16, good: 36, excellent: 42 }
  # ── grade56 → 小学五年级 ──────────────────────────────────────────────
  - tier: grade56
