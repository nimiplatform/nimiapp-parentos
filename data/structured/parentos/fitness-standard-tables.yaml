      - { metricId: fitness.run_50m, direction: lower_better, pass: 10.9, good: 8.9, excellent: 8.3 }
      - { metricId: fitness.sit_and_reach, direction: higher_better, pass: 2.0, good: 15.0, excellent: 18.4 }
      - { metricId: fitness.standing_long_jump, direction: higher_better, pass: 140, good: 170, excellent: 184 }
      - { metricId: fitness.vital_capacity, direction: higher_better, pass: 1350, good: 2350, excellent: 2550 }
      - { metricId: fitness.sit_ups, direction: higher_better, pass: 20, good: 40, excellent: 46 }
      - { metricId: fitness.run_800m, direction: lower_better, pass: 295, good: 245, excellent: 229 }
