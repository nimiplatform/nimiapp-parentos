      - { metricId: fitness.run_50m, direction: lower_better, pass: 10.8, good: 8.8, excellent: 8.6 }
      - { metricId: fitness.sit_and_reach, direction: higher_better, pass: -2.6, good: 9.4, excellent: 13.8 }
      - { metricId: fitness.rope_skipping, direction: higher_better, pass: 56, good: 126, excellent: 138 }
      - { metricId: fitness.vital_capacity, direction: higher_better, pass: 1300, good: 2200, excellent: 2700 }
      - { metricId: fitness.sit_ups, direction: higher_better, pass: 18, good: 38, excellent: 44 }
      - { metricId: fitness.run_50x8, direction: lower_better, pass: 138, good: 108, excellent: 102 }
  - tier: grade56
